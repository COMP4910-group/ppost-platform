version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ppost
      POSTGRES_USER: ppost_user
      POSTGRES_PASSWORD: localdev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./packages/api
    ports: ["3001:3001"]
    environment:
      DATABASE_URL: postgres://ppost_user:localdev@db:5432/ppost
    depends_on: [db]

  web:
    build: ./packages/web
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata: